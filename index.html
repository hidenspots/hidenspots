<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hiden Spots – Home • Discover Hidden Places</title>
  <meta name="description" content="Discover hidden gems, secret places, offbeat locations, and underrated travel spots in India and worldwide. Explore solo safety, cinematic destinations, and more on Hiden Spots.">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;width:100%;font-family:'Playfair Display',serif;background:#0c0f18;color:#fff;overflow-x:hidden;scroll-behavior:smooth}
    @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    header{position:fixed;top:0;left:0;width:100%;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 3rem;background:rgba(10,12,20,.3);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.1);}
    .brand{display:flex;align-items:center;gap:.7rem;color:#fff;text-decoration:none}
    .brand svg{width:36px;height:36px;flex:0 0 36px}
    .brand span{font-size:1.5rem;letter-spacing:3px}
    .brand:hover{color:#ffd88d;transition:.35s}
    .auth-actions{display:flex;gap:.5rem}
    .auth-btn{padding:.5rem 1rem;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-size:.95rem;}
    .primary{background:linear-gradient(90deg,#ffd88d,#ffb347);color:#0c0f18;font-weight:600}
    .user-menu{position:relative}
    .avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#ffd88d;font-weight:600}
    .menu-pop{position:absolute;right:0;top:120%;background:#121624;border:1px solid rgba(255,255,255,.12);border-radius:12px;display:none;min-width:160px;overflow:hidden;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .menu-pop a,.menu-pop button{display:block;width:100%;padding:.7rem 1rem;background:none;border:0;color:#fff;text-align:left;cursor:pointer}
    .menu-pop a:hover,.menu-pop button:hover{background:rgba(255,255,255,.08)}
    .hero{margin-top:84px;height:70vh;position:relative;overflow:hidden;border-radius:20px;margin-inline:3%;animation:fadeUp 1.2s ease-out both;}
    .hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s ease-in-out;}
    .hero-slide.active{opacity:1;}
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(12,15,25,.9) 0%,rgba(12,15,25,.4) 60%,transparent 100%);z-index:1;}
    .hero-text{position:absolute;bottom:2.6rem;left:2.6rem;z-index:2;max-width:560px}
    .hero-kicker{font-size:.9rem;letter-spacing:2px;opacity:.85;text-transform:uppercase;margin-bottom:.35rem}
    .hero-title{font-size:2.4rem;margin-bottom:.6rem;color:#ffd88d;line-height:1.15}
    .hero-sub{opacity:.9;font-size:1.06rem;line-height:1.5}
    .hero-cta{margin-top:1rem;padding:.6rem 1.5rem;font-size:1rem;border:none;border-radius:40px;background:linear-gradient(90deg,#ffd88d,#ffb347);color:#0c0f18;font-weight:600;cursor:pointer;transition:.28s;}
    .hero-cta:hover{transform:translateY(-2px);box-shadow:0 0 10px rgba(255,216,141,.4)}
    .categories{display:flex;overflow-x:auto;gap:1rem;padding:1.1rem 2.5rem;margin-top:1rem;scrollbar-width:none;}
    .categories::-webkit-scrollbar{display:none;}
    .category{padding:0.6rem 1.4rem;border-radius:30px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);white-space:nowrap;font-size:0.98rem;cursor:pointer;transition:all 0.3s ease;color:#fff;opacity:0.9;}
    .category:hover{background:rgba(255,255,255,.15);transform:scale(1.05);box-shadow:0 0 15px rgba(255,216,141,.3);}
    .category.active{background:linear-gradient(90deg,#ffd88d,#19547b);color:#0c0f18;font-weight:600;transform:scale(1.08);box-shadow:0 0 20px rgba(255,216,141,.5);border-color:transparent;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2rem;padding:2rem 2rem 8rem 2rem;}
    .card{background:#141824;border-radius:20px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.35);animation:fadeUp .8s ease both;margin-bottom:1rem;transition:transform 0.3s ease,box-shadow 0.3s ease;}
    .card:hover{transform:translateY(-10px);box-shadow:0 20px 50px rgba(0,0,0,.5);}
    .card:hover .card-media img{transform:scale(1.08);}
    .card-media{position:relative;height:220px;overflow:hidden;}
    .card-media img{width:100%;height:100%;object-fit:cover;transition:0.4s ease;}
    .card-media:hover img{transform:scale(1.05);filter:brightness(.85);}
    .card-badge{position:absolute;left:.75rem;bottom:.75rem;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);padding:.28rem .55rem;border-radius:20px;font-size:.8rem;letter-spacing:.5px;border:1px solid rgba(255,255,255,.12);color:#ffd88d}
    .card-info{padding:1.2rem 1.2rem 0.8rem;border-top:1px solid rgba(255,255,255,.06);}
    .card-title{font-size:1.1rem;margin-bottom:0.4rem;color:#ffd88d;}
    .card-sub{font-size:0.95rem;opacity:0.85;}
    .card-meta{display:flex;align-items:center;justify-content:space-between;padding:0.8rem 1.2rem;gap:0.8rem;border-top:1px solid rgba(255,255,255,.06);}
    .meta-left{display:flex;align-items:center;gap:.6rem;}
    .avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.2)}
    .username{font-size:.9rem;opacity:.9;cursor:pointer;color:#ffd88d}
    .username:hover{text-decoration:underline}
    .meta-right{display:flex;align-items:center;gap:.5rem;}
    .follow{padding:0.45rem 1.2rem;border-radius:30px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:0.95rem;font-weight:500;cursor:pointer;transition:all 0.3s ease;}
    .follow.following{background:linear-gradient(90deg,#ffd88d,#ffb347);color:#0c0f18;border-color:transparent;}
    .menu{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);cursor:pointer}
    .menu:after{content:"⋯";font-size:18px;line-height:0;opacity:.85}
    .heart{font-size:28px;cursor:pointer;transition:transform 0.3s ease,color 0.3s ease;color:rgba(255,255,255,.7);}
    .heart.active{color:#ff4d4d;transform:scale(1.2);}
    .heart:hover,.heart:active{transform:scale(1.3);}
    .card-story{padding:0 1.2rem 1.2rem;}
    .story-text{font-size:0.98rem;line-height:1.65;opacity:0.92;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:0.8rem;padding:0 0.4rem;}
    .read-more{display:inline-block;margin-top:0.8rem;padding:0.45rem 1.1rem;font-size:0.92rem;color:#ffd88d;background:rgba(255,216,141,0.12);border:1px solid rgba(255,216,141,0.3);border-radius:30px;text-decoration:none;transition:all 0.3s ease;}
    .read-more:hover,.read-more:focus{background:rgba(255,216,141,0.25);transform:translateY(-2px);}
    .floating-btn{position:fixed;bottom:100px;right:50px;background:linear-gradient(135deg,#ffd88d,#ffb347);border:none;border-radius:50%;width:60px;height:60px;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#0c0f18;cursor:pointer;box-shadow:0 0 15px rgba(255,216,141,.4);transition:.4s;z-index:60}
    .floating-btn:hover{transform:scale(1.05) rotate(10deg)}
    .nav-bar{background:rgba(255,255,255,.05);backdrop-filter:blur(25px);border-radius:60px;padding:1rem 2.5rem;border:1px solid rgba(255,255,255,.12);position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);display:flex;gap:3rem;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:80}
    .nav-icon{color:rgba(255,255,255,.7);transition:.4s}
    .nav-icon:hover{color:#FFD88D;transform:translateY(-2px);filter:drop-shadow(0 0 10px rgba(255,216,155,.6))}
    .nav-icon svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;fill:none}
    @media(max-width:900px){.hero{height:58vh}.hero-title{font-size:2rem}.hero-sub{font-size:1rem}}
    @media(max-width:768px){header{padding:1rem 1.5rem}.hero-text{left:1.2rem;right:1.2rem}.grid{padding:1rem 1rem 6.5rem}.floating-btn{bottom:90px;right:22px}.nav-bar{gap:2rem;padding:.9rem 1.6rem}}
    .skeleton-card{background:#141824;border-radius:20px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.35);height:420px;animation:pulse 1.5s infinite ease-in-out;}
    .skeleton-media{height:240px;background:linear-gradient(90deg,#1a1f2e 0%,#22273a 50%,#1a1f2e 100%);background-size:200% 100%;animation:shimmer 2s infinite linear;}
    .skeleton-text{height:20px;margin:1rem 1.2rem;background:#22273a;border-radius:4px;}
    .skeleton-meta{display:flex;justify-content:space-between;padding:0 1.2rem 1rem;}
    .skeleton-avatar{width:28px;height:28px;border-radius:50%;background:#22273a;}
    .skeleton-username{width:100px;height:16px;background:#22273a;border-radius:4px;}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}
  </style>
</head>
<body>

<header>
  <a href="index.html" class="brand">
    <svg width="34" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="21" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>
      <path d="M24 10 L28 24 L24 38 L20 24 Z" fill="rgba(255,216,155,0.9)"/>
      <circle cx="24" cy="24" r="2.6" fill="#fff"/>
    </svg>
    <span>Hiden Spots</span>
  </a>

  <div class="auth-actions" id="authActions">
    <button class="auth-btn" id="openLogin">Login</button>
    <button class="auth-btn primary" id="openSignup">Signup</button>
  </div>

  <div class="user-menu" id="userMenu" style="display:none">

    <div class="menu-pop" id="menuPop">
      <a href="about.html">About</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<section class="hero" id="hero">
  <div class="hero-slide active"></div>
  <div class="hero-slide"></div>
  <div class="hero-slide"></div>
  <div class="hero-slide"></div>
  <div class="hero-overlay"></div>
  <div class="hero-text">
    <div class="hero-kicker" id="heroTheme"></div>
    <h1 class="hero-title" id="heroTitle"></h1>
    <p class="hero-sub" id="heroSub"></p>
    <button class="hero-cta" id="heroCta">View Location</button>
  </div>
</section>

<div class="categories" id="categoryChips">
  <div class="category active" data-filter="all">All</div>
  <div class="category" data-filter="Adventure">Adventure</div>
  <div class="category" data-filter="Spiritual">Spiritual</div>
  <div class="category" data-filter="Solo">Solo</div>
  <div class="category" data-filter="Nature">Nature</div>
  <div class="category" data-filter="Family">Family</div>
</div>

<section class="grid" id="grid"></section>

<button class="floating-btn" onclick="window.location.href='Upload.html'" title="Add Destination">+</button>

<nav class="nav-bar" aria-label="Primary">
  <a href="index.html" class="nav-icon" title="Home" aria-label="Home">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </a>
  <a href="Search.html" class="nav-icon" title="Search" aria-label="Search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
  </a>
  <a href="Upload.html" class="nav-icon" title="Create" aria-label="Create">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </a>
  <a href="Explore.html" class="nav-icon" title="Destiny List" aria-label="Destiny List">
    <svg viewBox="0 0 24 24">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
      <circle cx="12" cy="9" r="2.5" fill="none"/>
      <path d="M12 6l.9 1.8 2 .3-1.5 1.5.35 2.1L12 11l-1.75.7.35-2.1-1.5-1.5 2-.3L12 6z" fill="currentColor"/>
    </svg>
  </a>
  <a href="Profile.html" class="nav-icon" title="Profile" aria-label="Profile">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// SUPABASE CLIENT
const sb = supabase.createClient(
  "https://bhktkjegansxplpdtack.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJoa3RramVnYW5zeHBscGR0YWNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU2OTE2NjQsImV4cCI6MjA4MTI2NzY2NH0.WlQTPkC6WBjaK_Guy0_XPGahR9oNYsbIHdaBn4WQspE"
);

// GLOBALS
let currentUser = null;
let allSpots = [];
const grid = document.getElementById('grid');

// ────────────────────────────────────────────────
// AUTH & UI
// ────────────────────────────────────────────────
const authActions = document.getElementById('authActions');
const userMenu = document.getElementById('userMenu');
const avatarBtn = document.getElementById('avatarBtn');
const menuPop = document.getElementById('menuPop');
const logoutBtn = document.getElementById('logoutBtn');

function updateUI(session) {
  currentUser = session?.user ?? null;
  if (session) {
    authActions.style.display = 'none';
    userMenu.style.display = 'block';
    avatarBtn.textContent = session.user.email[0].toUpperCase();
  } else {
    authActions.style.display = 'flex';
    userMenu.style.display = 'none';
  }
}

sb.auth.onAuthStateChange((_, session) => {
  updateUI(session);
});

sb.auth.getSession().then(({ data }) => updateUI(data.session));

logoutBtn.onclick = async () => {
  await sb.auth.signOut();
  menuPop.style.display = 'none';
};

// ────────────────────────────────────────────────
// LOAD SPOTS + FOLLOW STATUS
// ────────────────────────────────────────────────
async function loadSpots() {
  grid.innerHTML = '<div class="skeleton-card"></div>'.repeat(5);

  try {
    const { data: spots, error } = await sb
      .from('spots')
      .select('id, name, place, city, story, media_urls, media_url, username, category_id, emotion_id, slug')
      .order('created_at', { ascending: false });

    if (error) throw error;
    if (!spots?.length) {
      grid.innerHTML = '<p style="text-align:center;padding:50px;opacity:0.7;">No hidden spots yet.</p>';
      return;
    }

    allSpots = spots;
    await renderGrid(allSpots);
  } catch (err) {
    console.error('Load spots error:', err);
    grid.innerHTML = '<p style="text-align:center;padding:50px;opacity:0.7;">Error loading spots.</p>';
  }
}

// ────────────────────────────────────────────────
// RENDER GRID WITH FOLLOW STATUS
// ────────────────────────────────────────────────
async function renderGrid(spotsToShow) {
  let followedUsers = [];
  if (currentUser) {
    const { data } = await sb
      .from('follows')
      .select('following_id')
      .eq('follower_id', currentUser.id);
    followedUsers = data?.map(f => f.following_id) || [];
  }

  const categoryNames = {1:'Adventure',2:'Spiritual',3:'Historical',4:'Horror',5:'Solo',6:'Family',7:'Restaurant',8:'Nature'};
  const emotionNames = {1:'Peaceful',2:'Long Drive',3:'Romantic',4:'Spiritual',5:'Lonely',6:'Broken',7:'Relaxation',8:'Energetic'};

  const html = spotsToShow.map(spot => {
    const firstImage = spot.media_urls?.[0]?.url || spot.media_url || 'https://via.placeholder.com/300x220/141824/FFD88D?text=No+Image';
    const linkUrl = spot.slug ? `/spot?slug=${spot.slug}` : `/spot?id=${spot.id}`;
    const isFollowing = followedUsers.includes(spot.username);
    const followText = isFollowing ? 'Following' : 'Follow';
    const followClass = isFollowing ? 'following' : '';

    return `
    <article class="card">
      <div class="card-media">
        <img src="${firstImage}" alt="${spot.name}"
             onerror="this.src='https://via.placeholder.com/300x220/141824/FFD88D?text=No+Image'">
        <span class="card-badge">${spot.city} • ${categoryNames[spot.category_id] || 'Other'}</span>
      </div>
      <div class="card-info">
        <h3 class="card-title">${spot.name}</h3>
        <p class="card-sub">${spot.place}, ${spot.city}</p>
      </div>
      <div class="card-meta">
        <div class="meta-left">
          <img class="avatar" src="${getAvatarUrl(spot.username)}" alt=""
               onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(spot.username || 'User')}&background=FFD88D&color=0c0f18&size=80'">
          <span class="username" onclick="goToProfile('${spot.username}')">@${spot.username || 'traveller'}</span>
        </div>
        <div class="meta-right">
          <button class="follow ${followClass}" onclick="toggleFollow('${spot.username}', this)">${followText}</button>
          <div class="heart" onclick="toggleDestiny('${spot.id}', this)">♡</div>
        </div>
      </div>
      <div class="card-story">
        <p class="story-text">${spot.story || 'No story shared.'}</p>
        <a class="read-more" href="${linkUrl}">Read more</a>
      </div>
    </article>`;
  }).join('');

  grid.innerHTML = html;
}

// ────────────────────────────────────────────────
// FOLLOW TOGGLE (FIXED)
// ────────────────────────────────────────────────
async function toggleFollow(username, button) {
  if (!currentUser) {
    alert('Please login to follow users');
    return;
  }

  const isFollowing = button.classList.contains('following');

  try {
    if (isFollowing) {
      await sb.from('follows')
        .delete()
        .eq('follower_id', currentUser.id)
        .eq('following_id', username);
      button.textContent = 'Follow';
      button.classList.remove('following');
    } else {
      await sb.from('follows').insert({
        follower_id: currentUser.id,
        following_id: username
      });
      button.textContent = 'Following';
      button.classList.add('following');
    }
  } catch (err) {
    console.error('Follow error:', err);
    alert('Failed to update follow. Please try again.');
  }
}

// ────────────────────────────────────────────────
// FILTERS (CATEGORY + EMOTION)
// ────────────────────────────────────────────────
const filterChips = document.querySelectorAll('.category');
filterChips.forEach(chip => {
  chip.addEventListener('click', async () => {
    filterChips.forEach(c => c.classList.remove('active'));
    chip.classList.add('active');

    const filter = chip.dataset.filter;
    if (filter === 'all') {
      await renderGrid(allSpots);
      return;
    }

    const filtered = allSpots.filter(spot => {
      const catName = {1:'Adventure',2:'Spiritual',3:'Historical',4:'Horror',5:'Solo',6:'Family',7:'Restaurant',8:'Nature'}[spot.category_id];
      const emoName = {1:'Peaceful',2:'Long Drive',3:'Romantic',4:'Spiritual',5:'Lonely',6:'Broken',7:'Relaxation',8:'Energetic'}[spot.emotion_id];
      return catName === filter || emoName === filter;
    });

    await renderGrid(filtered);
  });
});

// ────────────────────────────────────────────────
// HERO SLIDESHOW (SIMPLIFIED)
// ────────────────────────────────────────────────
async function loadHeroSlides() {
  try {
    const { data: spots } = await sb
      .from('spots')
      .select('id, name, place, city, story, media_urls, media_url, category_id, slug')
      .order('created_at', { ascending: false })
      .limit(4);

    if (!spots?.length) return;

    const slides = document.querySelectorAll('.hero-slide');
    spots.forEach((spot, i) => {
      const url = spot.media_urls?.[0]?.url || spot.media_url || 'https://via.placeholder.com/1200x800/141824/FFD88D?text=Spot';
      slides[i].style.backgroundImage = `url(${url})`;
    });

    // Simple auto-cycle (optional)
    let idx = 0;
    setInterval(() => {
      slides.forEach(s => s.classList.remove('active'));
      slides[idx].classList.add('active');
      idx = (idx + 1) % slides.length;
    }, 5000);
  } catch (e) {
    console.error('Hero error:', e);
  }
}

// ────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────
async function init() {
  await loadHeroSlides();
  await loadSpots();
}

init();
</script>
</body>
</html>
