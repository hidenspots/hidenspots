// GLOBAL VARIABLES

// Auth elements

// ────────────────────────────────────────────────
// AUTH & UI LOGIC
// ────────────────────────────────────────────────
function updateUI(session) {
  currentUser = session?.user ?? null;
  if (session) {
    authActions.style.display = 'none';
    userMenu.style.display = 'block';
    avatarBtn.textContent = session.user.email?.[0]?.toUpperCase() || 'U';
  } else {
    authActions.style.display = 'flex';
    userMenu.style.display = 'none';
  }
}

sb.auth.onAuthStateChange((_, session) => updateUI(session));
sb.auth.getSession().then(({ data }) => updateUI(data.session));

openLogin.onclick = () => { authMode = 'login'; openAuthModal(); };
openSignup.onclick = () => { authMode = 'signup'; openAuthModal(); };

function openAuthModal() {
  authTitle.textContent = authMode === 'login' ? 'Login' : 'Signup';
  switchMode.textContent = authMode === 'login' ? 'Switch to Signup' : 'Switch to Login';
  authError.textContent = '';
  usernameInput.style.display = authMode === 'signup' ? 'block' : 'none';
  authModal.style.display = 'flex';
}

switchMode.onclick = () => {
  authMode = authMode === 'login' ? 'signup' : 'login';
  openAuthModal();
};

submitAuth.onclick = async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  const username = usernameInput.value.trim();

  if (!email || !password || (authMode === 'signup' && !username)) {
    authError.textContent = 'All fields are required';
    return;
  }

  authError.textContent = 'Processing...';

  let res;
  try {
    if (authMode === 'login') {
      res = await sb.auth.signInWithPassword({ email, password });
    } else {
      res = await sb.auth.signUp({
        email,
        password,
        options: { data: { username, full_name: username } }
      });
    }

    if (res.error) {
      authError.textContent = res.error.message;
      return;
    }

    authError.textContent = 'Success!';
    setTimeout(() => {
      authModal.style.display = 'none';
      location.reload();
    }, 1200);
  } catch (err) {
    authError.textContent = 'Error. Try again.';
    console.error(err);
  }
};

avatarBtn.onclick = (e) => {
  e.stopPropagation();
  menuPop.style.display = menuPop.style.display === 'block' ? 'none' : 'block';
};

menuPop.onclick = e => e.stopPropagation();
document.addEventListener('click', () => menuPop.style.display = 'none');

logoutBtn.onclick = async (e) => {
  e.stopPropagation();
  await sb.auth.signOut();
  location.reload();
};

// ────────────────────────────────────────────────
// AVATAR HELPER
// ────────────────────────────────────────────────
function getAvatarUrl(username) {
  if (!username) return 'https://ui-avatars.com/api/?name=User&background=FFD88D&color=0c0f18&size=80';
  return `https://hiden-spots-r2-proxy.whynot555x7.workers.dev/file/avatars/${username}-avatar.jpg`;
}

// ────────────────────────────────────────────────
// HERO SLIDESHOW
// ────────────────────────────────────────────────
const slideEls = document.querySelectorAll('.hero-slide');
const themeEl = document.getElementById('heroTheme');
const titleEl = document.getElementById('heroTitle');
const subEl = document.getElementById('heroSub');
const ctaBtn = document.getElementById('heroCta');
let heroSpots = [];
let heroIdx = 0;

async function loadHeroSlides() {
  try {
    const { data: spots, error } = await sb
      .from('spots')
      .select('id, name, place, city, story, media_urls, media_url, category_id, slug')
      .order('created_at', { ascending: false })
      .limit(12);

    if (error || !spots?.length) {
      console.warn('No spots for hero slideshow');
      return;
    }

    heroSpots = spots.sort(() => 0.5 - Math.random()).slice(0, 4);

    heroSpots.forEach((spot, i) => {
      const url = spot.media_urls?.[0]?.url || spot.media_url || 'https://via.placeholder.com/1200x800/141824/FFD88D?text=Spot';
      slideEls[i].style.backgroundImage = `url('${url}')`;
    });

    renderHero(0);
  } catch (err) {
    console.error('Hero slideshow failed:', err);
  }
}

function renderHero(index) {
  const spot = heroSpots[index];
  if (!spot) return;

  slideEls.forEach(s => s.classList.remove('active'));
  slideEls[index].classList.add('active');

  const categoryNames = {1:'Adventure',2:'Spiritual',3:'Historical',4:'Horror',5:'Solo',6:'Family',7:'Restaurant',8:'Nature'};
  themeEl.textContent = categoryNames[spot.category_id] || 'Hidden Gem';
  titleEl.textContent = spot.name || 'Untitled Spot';
  subEl.textContent = spot.story?.slice(0, 120) + (spot.story?.length > 120 ? '...' : '') || 'Discover this hidden place...';

  const linkUrl = spot.slug ? `/spot?slug=${spot.slug}` : `/spot?id=${spot.id}`;
  ctaBtn.onclick = () => window.location.href = linkUrl;
}

setInterval(() => {
  heroIdx = (heroIdx + 1) % heroSpots.length;
  renderHero(heroIdx);
}, 5200);

async function loadSpots() {

  try {
    const { data: spots, error } = await sb
      .from('spots')
      .select('id, name, place, city, story, media_urls, media_url, username, category_id, emotion_id, slug')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Supabase error:', error);
      grid.innerHTML = '<p style="text-align:center;color:#ff6b6b;padding:50px;">Database error: ' + error.message + '</p>';
      return;
    }

    if (!spots || spots.length === 0) {
      grid.innerHTML = '<p style="text-align:center;padding:50px;opacity:0.7;">No hidden spots yet.</p>';
      return;
    }

    allSpots = spots;
    renderGrid(allSpots);
  } catch (err) {
    console.error('loadSpots failed:', err);
    grid.innerHTML = '<p style="text-align:center;color:#ff6b6b;padding:50px;">Failed to load spots. Check console.</p>';
  }
}

// ────────────────────────────────────────────────
// RENDER CARDS
// ────────────────────────────────────────────────
function renderGrid(spotsToShow) {
  const categoryNames = {1:'Adventure',2:'Spiritual',3:'Historical',4:'Horror',5:'Solo',6:'Family',7:'Restaurant',8:'Nature'};

  const html = spotsToShow.map(spot => {
    const firstImage = spot.media_urls?.[0]?.url || spot.media_url || 'https://via.placeholder.com/300x220/141824/FFD88D?text=No+Image';
    const linkUrl = spot.slug ? `/spot?slug=${spot.slug}` : `/spot?id=${spot.id}`;

    return `
    <article class="card">
      <div class="card-media">
        <img src="${firstImage}" alt="${spot.name}"
             onerror="this.src='https://via.placeholder.com/300x220/141824/FFD88D?text=No+Image'">
        <span class="card-badge">${spot.city} • ${categoryNames[spot.category_id] || 'Other'}</span>
      </div>
      <div class="card-info">
        <h3 class="card-title">${spot.name}</h3>
        <p class="card-sub">${spot.place}, ${spot.city}</p>
      </div>
      <div class="card-meta">
        <div class="meta-left">
          <img class="avatar" src="${getAvatarUrl(spot.username)}" alt=""
               onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(spot.username || 'User')}&background=FFD88D&color=0c0f18&size=80'">
          <span class="username" onclick="goToProfile('${spot.username}')">@${spot.username || 'traveller'}</span>
        </div>
        <div class="meta-right">
          <button class="follow" onclick="toggleFollow('${spot.username}', this)">Follow</button>
          <div class="heart" onclick="toggleDestiny('${spot.id}', this)">♡</div>
        </div>
      </div>
      <div class="card-story">
        <p class="story-text">${spot.story || 'No story shared.'}</p>
        <a class="read-more" href="${linkUrl}">Read more</a>
      </div>
    </article>`;
  }).join('');

  grid.innerHTML = html;
}

// ────────────────────────────────────────────────
// FILTERS
// ────────────────────────────────────────────────
categoryChips.addEventListener('click', (e) => {
  const chip = e.target.closest('.category');
  if (!chip) return;

  document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');

  const filter = chip.dataset.filter;

  if (filter === 'all') {
    renderGrid(allSpots);
  } else {
    const filtered = allSpots.filter(spot => {
      const catName = {1:'Adventure',2:'Spiritual',3:'Historical',4:'Horror',5:'Solo',6:'Family',7:'Restaurant',8:'Nature'}[spot.category_id];
      return catName === filter;
    });
    renderGrid(filtered);
  }
});

// ────────────────────────────────────────────────
// FOLLOW & OTHER PLACEHOLDERS
// ────────────────────────────────────────────────
async function toggleFollow(username, button) {
  if (!currentUser) {
    alert('Please login to follow users');
    return;
  }
  button.textContent = button.textContent === 'Follow' ? 'Following' : 'Follow';
}

function goToProfile(username) {
  if (username) window.location.href = `Profile.html?user=${username}`;
}

function toggleDestiny(spotId, button) {
  alert('Saved to Destiny List!');
}

// ────────────────────────────────────────────────
// INIT – MUST BE LAST
// ────────────────────────────────────────────────
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  updateUI(session);

  await loadHeroSlides();
  await loadSpots();          // this loads cards
}

document.addEventListener('DOMContentLoaded', init);
</script>
